<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Читалка</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- JSZip и epub.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --ui-bg: rgba(0, 0, 0, 0.8);
            --ui-border: rgba(255, 255, 255, 0.08);
            --accent: #07C980;
            --sub-text: rgba(161, 161, 161, 0.5);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewer-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #viewer {
            width: 100%;
            height: 100%;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        #viewer.dragging {
            transition: none;
        }

        /* --- ХЕДЕР И ФУТЕР --- */
        .ui-panel {
            position: fixed;
            left: 0;
            width: 100%;
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            transition: transform 0.25s ease, opacity 0.25s ease;
            box-sizing: border-box;
        }

        .header {
            top: 0;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--ui-border);
            border-radius: 0 0 5px 5px;
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .footer {
            bottom: 0;
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--ui-border);
            border-radius: 5px 5px 0 0;
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        .header.visible, .footer.visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 10px;
            text-align: center;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-author {
            font-size: 11px;
            color: var(--sub-text);
            margin-top: 2px;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--sub-text);
        }

        .progress-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 3px;
            border-radius: 2px;
            background: rgba(161, 161, 161, 0.2);
            outline: none;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .footer-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: inherit;
        }

        .btn-icon img {
            width: 24px;
            height: 24px;
            display: block;
            pointer-events: none;
        }

        /* --- ПЛАШКА ВЫДЕЛЕНИЯ ТЕКСТА --- */
        .selection-toolbar {
            position: fixed;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(215, 201, 128, 0.3);
            border-radius: 5px;
            padding: 6px 12px;
            display: none;
            gap: 14px;
            align-items: center;
            z-index: 250;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transform: translate(-50%, -120%);
        }

        .toolbar-btn {
            background: none;
            border: none;
            color: #D7C980;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 4px;
            font-size: 10px;
        }

        .toolbar-btn img {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        /* --- ПАНЕЛЬ НАСТРОЙКИ (ШРИФТ И ТЕМЫ) --- */
        .settings-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--ui-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--ui-border);
            border-radius: 5px 5px 0 0;
            padding: 16px 20px calc(18px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 110;
            transform: translateY(100%);
            transition: transform 0.25s ease;
        }

        .settings-sheet.visible {
            transform: translateY(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid var(--ui-border);
            padding-bottom: 10px;
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .theme-btn {
            border: 1px solid var(--ui-border);
            border-radius: 5px;
            padding: 8px 0;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            text-align: center;
        }

        .theme-white { background: #ffffff; color: #111; }
        .theme-sepia { background: #f4ecd8; color: #5b4636; }
        .theme-gray  { background: #333336; color: #eee; }
        .theme-black { background: #000000; color: #aaa; border-color: #333; }
        .theme-system { background: rgba(255,255,255,0.1); color: inherit; }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 14px;
            border-radius: 5px;
        }

        .font-chips {
            display: flex;
            gap: 6px;
        }

        .font-chip {
            background: rgba(255, 255, 255, 0.08);
            color: inherit;
            border: 1px solid transparent;
            border-radius: 5px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .font-chip.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .stepper-btn {
            background: rgba(255, 255, 255, 0.08);
            color: inherit;
            border: none;
            border-radius: 5px;
            width: 34px;
            height: 34px;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- БОКОВЫЕ ШТОРКИ --- */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 85%;
            max-width: 340px;
            height: 100%;
            background: var(--ui-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid var(--ui-border);
            z-index: 120;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .drawer.right-side {
            left: auto;
            right: 0;
            border-right: none;
            border-left: 1px solid var(--ui-border);
            transform: translateX(100%);
        }

        .drawer.visible {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 16px 18px;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--ui-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            list-style: none;
            margin: 0;
        }

        .drawer-item {
            padding: 14px 18px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }

        .card-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            padding: 10px;
            cursor: pointer;
        }

        .card-item.type-quote { border-left: 3px solid var(--accent); }
        .card-item.type-note { border-left: 3px solid #D7C980; }
        .card-item.type-bookmark { border-left: 3px solid #ff4b4b; }

        .card-date {
            font-size: 11px;
            color: var(--sub-text);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 90;
            display: none;
        }

        .overlay.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <div id="viewer"></div>
    </div>

    <div id="overlay" class="overlay" onclick="closeAllPanels()"></div>

    <!-- Всплывающая панель выделения текста с вашими SVG-иконками -->
    <div id="selection-toolbar" class="selection-toolbar">
        <button class="toolbar-btn" onclick="saveSelection('note')">
            <img src="icons/notes.svg" alt="Заметка">
            Заметка
        </button>
        <button class="toolbar-btn" style="color: var(--accent);" onclick="saveSelection('quote')">
            <img src="icons/qoute.svg" alt="Цитата">
            Цитата
        </button>
        <button class="toolbar-btn" onclick="copySelectionText()">
            <img src="icons/copy.svg" alt="Копировать">
            Копировать
        </button>
        <button class="toolbar-btn" onclick="shareSelectionText()">
            <img src="icons/forward.svg" alt="Поделиться">
            Поделиться
        </button>
    </div>

    <!-- Верхний Хедер -->
    <div id="header" class="ui-panel header">
        <button class="btn-icon" onclick="openDrawer('toc')">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <div class="header-title-box">
            <span id="book-title" class="header-title">Загрузка...</span>
            <span id="book-author" class="header-author">...</span>
        </div>
        <!-- Кнопка списка всех закладок -->
        <button class="btn-icon" onclick="openDrawer('bookmarks')">
            <img src="icons/list_of_bookmarks.svg" alt="Список закладок">
        </button>
    </div>

    <!-- Нижний Футер -->
    <div id="footer" class="ui-panel footer">
        <div class="progress-row">
            <span id="chapter-title">Глава: ...</span>
            <span id="chapter-pages-left">еще ... стр.</span>
        </div>
        <input type="range" id="progress-slider" class="progress-slider" min="0" max="100" value="0">
        <div class="footer-tools">
            <!-- 1. Заметки -->
            <button class="btn-icon" onclick="openDrawer('notes')" title="Заметки">
                <img src="icons/notes.svg" alt="Заметки">
            </button>
            <!-- 2. Цитаты -->
            <button class="btn-icon" onclick="openDrawer('quotes')" title="Цитаты">
                <img src="icons/qoute.svg" alt="Цитаты">
            </button>
            <!-- 3. Шрифты -->
            <button class="btn-icon" onclick="openSettingsSheet()" title="Шрифты">
                <img src="icons/fonts.svg" alt="Шрифты">
            </button>
            <!-- 4. Закладка (динамическое переключение black / red) -->
            <button id="btn-bookmark" class="btn-icon" onclick="toggleCurrentBookmark()" title="Закладка">
                <img id="bookmark-icon-img" src="icons/bookmark_black.svg" alt="Закладка">
            </button>
        </div>
    </div>

    <!-- Панель настроек оформления -->
    <div id="settings-sheet" class="settings-sheet">
        <div class="settings-header">
            <span>Настройки отображения</span>
            <button class="btn-icon" style="font-size: 16px; padding: 0;" onclick="closeAllPanels()">✕</button>
        </div>

        <div class="theme-buttons">
            <button class="theme-btn theme-white" onclick="applyTheme('white')">Белый</button>
            <button class="theme-btn theme-sepia" onclick="applyTheme('sepia')">Сепия</button>
            <button class="theme-btn theme-gray" onclick="applyTheme('gray')">Серый</button>
            <button class="theme-btn theme-black" onclick="applyTheme('black')">Черный</button>
            <button class="theme-btn theme-system" onclick="applyTheme('system')">Как в системе</button>
        </div>

        <div class="settings-row">
            <span style="font-size: 13px;">Шрифт</span>
            <div class="font-chips">
                <button class="font-chip active" id="font-system" onclick="changeFontFamily('system')">Системный</button>
                <button class="font-chip" id="font-serif" onclick="changeFontFamily('serif')">Serif</button>
                <button class="font-chip" id="font-mono" onclick="changeFontFamily('mono')">Mono</button>
            </div>
        </div>

        <div class="settings-row">
            <span style="font-size: 13px;">Размер текста</span>
            <div style="display: flex; gap: 8px;">
                <button class="stepper-btn" onclick="changeFontSize(-1)">−</button>
                <button class="stepper-btn" onclick="changeFontSize(1)">+</button>
            </div>
        </div>
    </div>

    <!-- Шторка: Оглавление -->
    <div id="toc-drawer" class="drawer">
        <div class="drawer-header">
            <span>Содержание</span>
            <button class="btn-icon" onclick="closeAllPanels()">✕</button>
        </div>
        <ul id="toc-list" class="drawer-list"></ul>
    </div>

    <!-- Шторка: Закладки -->
    <div id="bookmarks-drawer" class="drawer right-side">
        <div class="drawer-header">
            <span>Закладки</span>
            <button class="btn-icon" onclick="closeAllPanels()">✕</button>
        </div>
        <ul id="bookmarks-list" class="drawer-list"></ul>
    </div>

    <!-- Шторка: Заметки -->
    <div id="notes-drawer" class="drawer">
        <div class="drawer-header">
            <span>Мои заметки</span>
            <button class="btn-icon" onclick="closeAllPanels()">✕</button>
        </div>
        <ul id="notes-list" class="drawer-list"></ul>
    </div>

    <!-- Шторка: Цитаты -->
    <div id="quotes-drawer" class="drawer right-side">
        <div class="drawer-header">
            <span>Мои цитаты</span>
            <button class="btn-icon" onclick="closeAllPanels()">✕</button>
        </div>
        <ul id="quotes-list" class="drawer-list"></ul>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const BOOK_URL = "infinity_jest.epub";
        const book = ePub(BOOK_URL);
        const viewerEl = document.getElementById("viewer");
        const rendition = book.renderTo("viewer", {
            width: "100%",
            height: "100%",
            spread: "none"
        });

        let currentFontSize = parseInt(localStorage.getItem("book_font_size")) || 18;
        let currentFontFamily = localStorage.getItem("book_font_family") || "system";
        let savedTheme = localStorage.getItem("book_theme") || "black";
        let lastReadLocation = localStorage.getItem("book_last_location");
        let uiVisible = false;

        let activeSelection = null;

        const fonts = {
            system: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
            serif: "Georgia, 'Times New Roman', serif",
            mono: "Menlo, Monaco, Consolas, monospace"
        };

        const themes = {
            white:  { bg: "#ffffff", text: "#000000", ui: "rgba(255, 255, 255, 0.85)", border: "rgba(0, 0, 0, 0.08)", accent: "#000000", sub: "rgba(0,0,0,0.5)" },
            black:  { bg: "#000000", text: "#ffffff", ui: "rgba(0, 0, 0, 0.85)", border: "rgba(255, 255, 255, 0.08)", accent: "#07C980", sub: "rgba(161, 161, 161, 0.5)" },
            sepia:  { bg: "#f4ecd8", text: "#5b4636", ui: "rgba(244, 236, 216, 0.88)", border: "rgba(91, 70, 54, 0.12)", accent: "#5b4636", sub: "rgba(91, 70, 54, 0.55)" },
            gray:   { bg: "#2c2c2e", text: "#e5e5e7", ui: "rgba(35, 35, 38, 0.88)", border: "rgba(255, 255, 255, 0.08)", accent: "#07C980", sub: "rgba(161, 161, 161, 0.5)" }
        };

        function registerThemes() {
            for (let [name, t] of Object.entries(themes)) {
                rendition.themes.register(name, {
                    "body": {
                        "background-color": `${t.bg} !important`,
                        "color": `${t.text} !important`,
                        "padding": "0 20px !important",
                        "font-family": `${fonts[currentFontFamily]} !important`,
                        "line-height": "1.6 !important"
                    },
                    "p, span, div, h1, h2, h3, h4, h5, h6": {
                        "color": `${t.text} !important`,
                        "font-family": `${fonts[currentFontFamily]} !important`
                    }
                });
            }
        }

        registerThemes();
        applyTheme(savedTheme, false);
        rendition.display(lastReadLocation || undefined);

        book.loaded.metadata.then(meta => {
            document.getElementById("book-title").innerText = meta.title || "Книга";
            document.getElementById("book-author").innerText = meta.creator || "";
        });

        book.loaded.navigation.then(nav => {
            const list = document.getElementById("toc-list");
            list.innerHTML = "";
            nav.toc.forEach(chapter => {
                const li = document.createElement("li");
                li.className = "drawer-item";
                li.innerText = chapter.label.trim();
                li.onclick = () => {
                    rendition.display(chapter.href);
                    closeAllPanels();
                };
                list.appendChild(li);
            });
        });

        book.ready.then(() => book.locations.generate(1000)).then(() => updateProgress());

        rendition.on("relocated", location => {
            const cfi = location.start.cfi;
            localStorage.setItem("book_last_location", cfi);
            updateProgress(location);
            checkBookmarkState(cfi);
        });

        function updateProgress(location) {
            if (!book.locations.length()) return;
            const cur = location || rendition.currentLocation();
            if (cur && cur.start) {
                const pct = Math.floor(book.locations.percentageFromCfi(cur.start.cfi) * 100);
                document.getElementById("progress-slider").value = pct;

                const displayed = book.spine.get(cur.start.cfi);
                if (displayed && displayed.href) {
                    document.getElementById("chapter-title").innerText = `Глава: ${displayed.idref || "Текущая"}`;
                }
                const pagesLeft = Math.max(1, Math.round((100 - pct) * 0.4));
                document.getElementById("chapter-pages-left").innerText = `еще ${pagesLeft} стр.`;
            }
        }

        document.getElementById("progress-slider").addEventListener("change", (e) => {
            const cfi = book.locations.cfiFromPercentage(e.target.value / 100);
            rendition.display(cfi);
        });

        // ==========================================
        // ОБРАБОТКА СВАЙПОВ И ВЫДЕЛЕНИЙ
        // ==========================================
        let lastTapTime = 0;

        rendition.on("rendered", (section, view) => {
            const frameDoc = view.document;
            if (!frameDoc) return;

            let startX = 0, startY = 0, currentX = 0;
            let isSwiping = false;

            frameDoc.addEventListener("touchstart", (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                currentX = startX;
                isSwiping = false;
                viewerEl.classList.add("dragging");
            }, { passive: true });

            frameDoc.addEventListener("touchmove", (e) => {
                currentX = e.touches[0].clientX;
                const diffX = currentX - startX;
                const diffY = e.touches[0].clientY - startY;

                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                    isSwiping = true;
                    viewerEl.style.transform = `translateX(${diffX * 0.75}px)`;
                }
            }, { passive: true });

            frameDoc.addEventListener("touchend", (e) => {
                viewerEl.classList.remove("dragging");
                const diffX = currentX - startX;
                const totalDiff = Math.abs(diffX);

                if (isSwiping && totalDiff > 50) {
                    if (diffX < 0) {
                        viewerEl.style.transform = "translateX(-100vw)";
                        setTimeout(() => {
                            rendition.next();
                            viewerEl.style.transform = "translateX(0)";
                        }, 180);
                    } else {
                        viewerEl.style.transform = "translateX(100vw)";
                        setTimeout(() => {
                            rendition.prev();
                            viewerEl.style.transform = "translateX(0)";
                        }, 180);
                    }
                    hideSelectionToolbar();
                    return;
                }

                viewerEl.style.transform = "translateX(0)";

                const selection = frameDoc.getSelection();
                if (selection && selection.toString().trim().length > 0) return;

                // Двойной тап по центру
                if (!isSwiping && totalDiff < 10) {
                    const now = Date.now();
                    const width = window.innerWidth;
                    if (now - lastTapTime < 320 && startX > width * 0.25 && startX < width * 0.75) {
                        togglePanels();
                        lastTapTime = 0;
                        return;
                    }
                    lastTapTime = now;
                }
            }, { passive: true });

            restoreSavedHighlights();
        });

        // ==========================================
        // ВЫДЕЛЕНИЕ: ЗАМЕТКА, ЦИТАТА, КОПИРОВАНИЕ, ПОДЕЛИТЬСЯ
        // ==========================================
        rendition.on("selected", (cfiRange, contents) => {
            book.getRange(cfiRange).then(range => {
                if (!range) return;
                const text = range.toString().trim();
                if (!text) return;

                activeSelection = { cfi: cfiRange, text: text };

                const rect = range.getBoundingClientRect();
                const toolbar = document.getElementById("selection-toolbar");
                toolbar.style.left = `${Math.min(window.innerWidth - 130, Math.max(130, rect.left + rect.width / 2))}px`;
                toolbar.style.top = `${Math.max(70, rect.top - 10)}px`;
                toolbar.style.display = "flex";
            });
        });

        function hideSelectionToolbar() {
            document.getElementById("selection-toolbar").style.display = "none";
            activeSelection = null;
        }

        function saveSelection(type) {
            if (!activeSelection) return;

            const key = type === 'quote' ? "book_quotes" : "book_notes";
            const items = JSON.parse(localStorage.getItem(key) || "[]");

            items.unshift({
                text: activeSelection.text,
                cfi: activeSelection.cfi,
                date: new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
            });

            localStorage.setItem(key, JSON.stringify(items));

            const color = type === 'quote' ? "#07C980" : "#D7C980";
            rendition.annotations.highlight(activeSelection.cfi, {}, () => {}, `highlight-${type}`, { fill: color, fillOpacity: "0.35" });

            hideSelectionToolbar();
            if (tg) tg.HapticFeedback?.notificationOccurred("success");
        }

        function copySelectionText() {
            if (!activeSelection) return;
            navigator.clipboard.writeText(activeSelection.text).then(() => {
                hideSelectionToolbar();
                if (tg) tg.HapticFeedback?.notificationOccurred("success");
            });
        }

        function shareSelectionText() {
            if (!activeSelection) return;
            if (navigator.share) {
                navigator.share({
                    title: document.getElementById("book-title").innerText,
                    text: `«${activeSelection.text}»`
                }).catch(() => {});
            } else if (tg) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(activeSelection.text)}`);
            }
            hideSelectionToolbar();
        }

        function restoreSavedHighlights() {
            const quotes = JSON.parse(localStorage.getItem("book_quotes") || "[]");
            quotes.forEach(q => {
                rendition.annotations.highlight(q.cfi, {}, () => {}, "highlight-quote", { fill: "#07C980", fillOpacity: "0.35" });
            });
            const notes = JSON.parse(localStorage.getItem("book_notes") || "[]");
            notes.forEach(n => {
                rendition.annotations.highlight(n.cfi, {}, () => {}, "highlight-note", { fill: "#D7C980", fillOpacity: "0.35" });
            });
        }

        // ==========================================
        // ЗАКЛАДКИ (СМЕНА ИКОНКИ BLACK ↔ RED)
        // ==========================================
        function toggleCurrentBookmark() {
            const loc = rendition.currentLocation();
            if (!loc || !loc.start) return;

            const cfi = loc.start.cfi;
            let bookmarks = JSON.parse(localStorage.getItem("book_bookmarks") || "[]");
            const existingIdx = bookmarks.findIndex(b => b.cfi === cfi);
            const iconImg = document.getElementById("bookmark-icon-img");

            if (existingIdx >= 0) {
                bookmarks.splice(existingIdx, 1);
                iconImg.src = "icons/bookmark_black.svg";
            } else {
                bookmarks.unshift({
                    cfi: cfi,
                    preview: document.getElementById("chapter-title").innerText,
                    date: new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
                });
                iconImg.src = "icons/bookmark_red.svg";
                if (tg) tg.HapticFeedback?.notificationOccurred("success");
            }
            localStorage.setItem("book_bookmarks", JSON.stringify(bookmarks));
        }

        function checkBookmarkState(cfi) {
            const bookmarks = JSON.parse(localStorage.getItem("book_bookmarks") || "[]");
            const isBookmarked = bookmarks.some(b => b.cfi === cfi);
            const iconImg = document.getElementById("bookmark-icon-img");
            if (iconImg) {
                iconImg.src = isBookmarked ? "icons/bookmark_red.svg" : "icons/bookmark_black.svg";
            }
        }

        // ==========================================
        // ОТКРЫТИЕ ШТОРОК
        // ==========================================
        function openDrawer(type) {
            closeAllPanels();
            const listEl = document.getElementById(`${type}-list`);
            listEl.innerHTML = "";

            if (type === 'toc') {
                document.getElementById("toc-drawer").classList.add("visible");
            } else {
                const key = type === 'bookmarks' ? "book_bookmarks" : (type === 'quotes' ? "book_quotes" : "book_notes");
                const items = JSON.parse(localStorage.getItem(key) || "[]");

                if (items.length === 0) {
                    listEl.innerHTML = `<li style="padding: 20px; opacity: 0.5; text-align: center;">Список пуст</li>`;
                } else {
                    items.forEach(it => {
                        const li = document.createElement("li");
                        li.className = `card-item type-${type.slice(0, -1)}`;
                        li.innerHTML = `
                            <div style="font-size: 13px; line-height: 1.4;">«${it.text || it.preview || "Закладка"}»</div>
                            <div class="card-date">${it.date}</div>
                        `;
                        li.onclick = () => {
                            rendition.display(it.cfi);
                            closeAllPanels();
                        };
                        listEl.appendChild(li);
                    });
                }
                document.getElementById(`${type}-drawer`).classList.add("visible");
            }
            document.getElementById("overlay").classList.add("visible");
        }

        // ==========================================
        // ТЕМЫ И ОФОРМЛЕНИЕ
        // ==========================================
        function applyTheme(name, save = true) {
            let t = themes[name];
            if (name === 'system') {
                const isDark = tg?.colorScheme === 'dark' || window.matchMedia('(prefers-color-scheme: dark)').matches;
                t = isDark ? themes.black : themes.white;
            }

            rendition.themes.select(name === 'system' ? (tg?.colorScheme === 'dark' ? 'black' : 'white') : name);
            document.documentElement.style.setProperty("--bg-color", t.bg);
            document.documentElement.style.setProperty("--text-color", t.text);
            document.documentElement.style.setProperty("--ui-bg", t.ui);
            document.documentElement.style.setProperty("--ui-border", t.border);
            document.documentElement.style.setProperty("--accent", t.accent);
            document.documentElement.style.setProperty("--sub-text", t.sub);

            if (save) localStorage.setItem("book_theme", name);
        }

        function changeFontFamily(type) {
            currentFontFamily = type;
            localStorage.setItem("book_font_family", type);

            document.querySelectorAll(".font-chip").forEach(c => c.classList.remove("active"));
            const btn = document.getElementById(`font-${type}`);
            if (btn) btn.classList.add("active");

            registerThemes();
            applyTheme(localStorage.getItem("book_theme") || "black", false);
        }

        function changeFontSize(delta) {
            currentFontSize = Math.min(28, Math.max(14, currentFontSize + delta));
            rendition.themes.fontSize(`${currentFontSize}px`);
            localStorage.setItem("book_font_size", currentFontSize);
        }

        function togglePanels() {
            uiVisible = !uiVisible;
            document.getElementById("header").classList.toggle("visible", uiVisible);
            document.getElementById("footer").classList.toggle("visible", uiVisible);
            if (!uiVisible) {
                document.getElementById("settings-sheet").classList.remove("visible");
                document.getElementById("overlay").classList.remove("visible");
            }
        }

        function closeAllPanels() {
            uiVisible = false;
            document.getElementById("header").classList.remove("visible");
            document.getElementById("footer").classList.remove("visible");
            document.getElementById("settings-sheet").classList.remove("visible");
            document.querySelectorAll(".drawer").forEach(d => d.classList.remove("visible"));
            document.getElementById("overlay").classList.remove("visible");
            hideSelectionToolbar();
        }

        function openSettingsSheet() {
            document.getElementById("footer").classList.remove("visible");
            document.getElementById("settings-sheet").classList.add("visible");
        }
    </script>
</body>
</html>
