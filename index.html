<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Читалка</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- JSZip и epub.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f10;
            --text-color: #ececec;
            --ui-bg: rgba(26, 26, 28, 0.96);
            --ui-border: rgba(255, 255, 255, 0.1);
            --accent: #ff4b4b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewer-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #viewer {
            width: 100%;
            height: 100%;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }

        #viewer.dragging {
            transition: none;
        }

        /* Прозрачный жест-перехватчик поверх книги */
        #touch-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            background: transparent;
        }

        /* Индикатор-триггер меню вверху экрана */
        .menu-trigger-badge {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 14px;
            line-height: 1;
            padding: 4px 14px;
            border-radius: 12px;
            z-index: 60;
            cursor: pointer;
            backdrop-filter: blur(8px);
            opacity: 0.6;
        }

        /* --- ХЕДЕР И ФУТЕР --- */
        .ui-panel {
            position: fixed;
            left: 0;
            width: 100%;
            background: var(--ui-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            transition: transform 0.25s ease, opacity 0.25s ease;
            box-sizing: border-box;
        }

        .header {
            top: 0;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--ui-border);
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .header.visible, .footer.visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 10px;
            text-align: center;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-author {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .footer {
            bottom: 0;
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--ui-border);
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            opacity: 0.75;
        }

        .progress-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .footer-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: inherit;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ПАНЕЛЬ НАСТРОЙКИ С НАВИГАЦИЕЙ «НАЗАД» --- */
        .settings-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--ui-bg);
            border-top: 1px solid var(--ui-border);
            padding: 16px 20px calc(18px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 110;
            transform: translateY(100%);
            transition: transform 0.25s ease;
        }

        .settings-sheet.visible {
            transform: translateY(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0;
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .theme-btn {
            border: 1px solid var(--ui-border);
            border-radius: 10px;
            padding: 8px 0;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        .theme-white { background: #f7f7f7; color: #111; }
        .theme-sepia { background: #f4ecd8; color: #5b4636; }
        .theme-gray  { background: #333336; color: #eee; }
        .theme-black { background: #000000; color: #aaa; border-color: #444; }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 12px;
        }

        .font-chips {
            display: flex;
            gap: 6px;
        }

        .font-chip {
            background: rgba(255, 255, 255, 0.1);
            color: inherit;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .font-chip.active {
            border-color: var(--accent);
            background: rgba(255, 75, 75, 0.15);
        }

        .stepper-btn {
            background: rgba(255, 255, 255, 0.1);
            color: inherit;
            border: none;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- БОКОВЫЕ ШТОРКИ --- */
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 85%;
            max-width: 340px;
            height: 100%;
            background: var(--ui-bg);
            border-right: 1px solid var(--ui-border);
            z-index: 120;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .drawer.right-side {
            left: auto;
            right: 0;
            border-right: none;
            border-left: 1px solid var(--ui-border);
            transform: translateX(100%);
        }

        .drawer.visible {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--ui-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            list-style: none;
            margin: 0;
        }

        .drawer-item {
            padding: 14px 18px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }

        .quote-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 3px solid var(--accent);
            margin: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 0 8px 8px 0;
            padding: 10px;
            cursor: pointer;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 90;
            display: none;
        }

        .overlay.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <div id="viewer"></div>
    </div>

    <!-- Надежный сенсорный слой управления -->
    <div id="touch-layer"></div>
    <div class="menu-trigger-badge" onclick="togglePanels()">••• Меню</div>

    <div id="overlay" class="overlay" onclick="closeAllPanels()"></div>

    <!-- Верхний Хедер -->
    <div id="header" class="ui-panel header">
        <button class="btn-icon" onclick="openDrawer('toc')">☰</button>
        <div class="header-title-box">
            <span id="book-title" class="header-title">Загрузка...</span>
            <span id="book-author" class="header-author">...</span>
        </div>
        <button class="btn-icon" onclick="openDrawer('quotes')">”</button>
    </div>

    <!-- Нижний Футер -->
    <div id="footer" class="ui-panel footer">
        <div class="progress-row">
            <span id="chapter-title">Глава</span>
            <span id="reading-percent">0%</span>
        </div>
        <input type="range" id="progress-slider" class="progress-slider" min="0" max="100" value="0">
        <div class="footer-tools">
            <button class="btn-icon" onclick="openDrawer('toc')">📖</button>
            <button class="btn-icon" onclick="openDrawer('quotes')">”</button>
            <button class="btn-icon" style="color: var(--accent);" onclick="setBookmark()">🔖</button>
            <button class="btn-icon" onclick="openSettingsSheet()">Aa</button>
        </div>
    </div>

    <!-- Меню настроек с кнопкой возврата назад -->
    <div id="settings-sheet" class="settings-sheet">
        <div class="settings-header">
            <button class="btn-back" onclick="backToMainMenu()">← Меню</button>
            <span>Настройки оформления</span>
            <button class="btn-icon" style="font-size: 16px; padding: 0;" onclick="closeAllPanels()">✕</button>
        </div>

        <div class="theme-buttons">
            <button class="theme-btn theme-white" onclick="applyTheme('white')">Белый</button>
            <button class="theme-btn theme-sepia" onclick="applyTheme('sepia')">Сепия</button>
            <button class="theme-btn theme-gray" onclick="applyTheme('gray')">Серый</button>
            <button class="theme-btn theme-black" onclick="applyTheme('black')">Черный</button>
        </div>

        <div class="settings-row">
            <span style="font-size: 14px;">Шрифт</span>
            <div class="font-chips">
                <button class="font-chip active" id="font-system" onclick="changeFontFamily('system')">Системный</button>
                <button class="font-chip" id="font-serif" onclick="changeFontFamily('serif')">Serif</button>
                <button class="font-chip" id="font-mono" onclick="changeFontFamily('mono')">Mono</button>
            </div>
        </div>

        <div class="settings-row">
            <span style="font-size: 14px;">Размер текста</span>
            <div style="display: flex; gap: 10px;">
                <button class="stepper-btn" onclick="changeFontSize(-1)">−</button>
                <button class="stepper-btn" onclick="changeFontSize(1)">+</button>
            </div>
        </div>
    </div>

    <!-- Оглавление -->
    <div id="toc-drawer" class="drawer">
        <div class="drawer-header">
            <span>Содержание</span>
            <button class="btn-icon" onclick="closeAllPanels()">✕</button>
        </div>
        <ul id="toc-list" class="drawer-list"></ul>
    </div>

    <!-- Цитаты -->
    <div id="quotes-drawer" class="drawer right-side">
        <div class="drawer-header">
            <span>Цитаты</span>
            <button class="btn-icon" onclick="closeAllPanels()">✕</button>
        </div>
        <ul id="quotes-list" class="drawer-list"></ul>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const BOOK_URL = "infinity_jest.epub";
        const book = ePub(BOOK_URL);
        const viewerEl = document.getElementById("viewer");
        const rendition = book.renderTo("viewer", {
            width: "100%",
            height: "100%",
            spread: "none"
        });

        let currentFontSize = parseInt(localStorage.getItem("book_font_size")) || 18;
        let currentFontFamily = localStorage.getItem("book_font_family") || "system";
        let savedTheme = localStorage.getItem("book_theme") || "black";
        let lastReadLocation = localStorage.getItem("book_last_location");
        let uiVisible = false;

        const fonts = {
            system: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
            serif: "Georgia, 'Times New Roman', serif",
            mono: "Menlo, Monaco, Consolas, 'Courier New', monospace"
        };

        const themes = {
            white: { bg: "#ffffff", text: "#111111", ui: "rgba(245, 245, 247, 0.96)" },
            sepia: { bg: "#f4ecd8", text: "#5b4636", ui: "rgba(238, 228, 206, 0.96)" },
            gray:  { bg: "#2c2c2e", text: "#e5e5e7", ui: "rgba(44, 44, 46, 0.96)" },
            black: { bg: "#000000", text: "#a1a1a6", ui: "rgba(20, 20, 22, 0.96)" }
        };

        function registerThemes() {
            for (let [name, t] of Object.entries(themes)) {
                rendition.themes.register(name, {
                    "body": {
                        "background-color": `${t.bg} !important`,
                        "color": `${t.text} !important`,
                        "padding": "0 20px !important",
                        "font-family": `${fonts[currentFontFamily]} !important`,
                        "line-height": "1.6 !important"
                    },
                    "p, span, div, h1, h2, h3, h4, h5, h6": {
                        "color": `${t.text} !important`,
                        "font-family": `${fonts[currentFontFamily]} !important`
                    }
                });
            }
        }

        registerThemes();
        applyTheme(savedTheme, false);
        rendition.display(lastReadLocation || undefined);

        book.loaded.metadata.then(meta => {
            document.getElementById("book-title").innerText = meta.title || "Книга";
            document.getElementById("book-author").innerText = meta.creator || "";
        });

        book.loaded.navigation.then(nav => {
            const list = document.getElementById("toc-list");
            list.innerHTML = "";
            nav.toc.forEach(chapter => {
                const li = document.createElement("li");
                li.className = "drawer-item";
                li.innerText = chapter.label.trim();
                li.onclick = () => {
                    rendition.display(chapter.href);
                    closeAllPanels();
                };
                list.appendChild(li);
            });
        });

        book.ready.then(() => book.locations.generate(1000)).then(() => updateProgress());

        rendition.on("relocated", location => {
            const cfi = location.start.cfi;
            localStorage.setItem("book_last_location", cfi);
            updateProgress(location);
        });

        function updateProgress(location) {
            if (!book.locations.length()) return;
            const cur = location || rendition.currentLocation();
            if (cur && cur.start) {
                const pct = Math.floor(book.locations.percentageFromCfi(cur.start.cfi) * 100);
                document.getElementById("reading-percent").innerText = `${pct}%`;
                document.getElementById("progress-slider").value = pct;
            }
        }

        document.getElementById("progress-slider").addEventListener("change", (e) => {
            const cfi = book.locations.cfiFromPercentage(e.target.value / 100);
            rendition.display(cfi);
        });

        // =======================================================
        // ЕДИНЫЙ КОНТРОЛЛЕР СЕНСОРА: ТОЛЬКО СВАЙПЫ И ДВОЙНОЙ ТАП
        // (ОДИНОЧНЫЙ ТАП БОЛЬШЕ СТРАНИЦЫ НЕ ЛИСТАЕТ)
        // =======================================================
        const touchLayer = document.getElementById("touch-layer");
        let startX = 0, startY = 0, currentX = 0;
        let isSwiping = false;
        let lastTapTime = 0;

        touchLayer.addEventListener("touchstart", (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            currentX = startX;
            isSwiping = false;
            viewerEl.classList.add("dragging");
        }, { passive: true });

        touchLayer.addEventListener("touchmove", (e) => {
            currentX = e.touches[0].clientX;
            const diffX = currentX - startX;
            const diffY = e.touches[0].clientY - startY;

            // Если движение горизонтальное — сдвигаем страницу
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                isSwiping = true;
                viewerEl.style.transform = `translateX(${diffX * 0.75}px)`;
            }
        }, { passive: true });

        touchLayer.addEventListener("touchend", (e) => {
            viewerEl.classList.remove("dragging");
            const diffX = currentX - startX;
            const totalDiff = Math.abs(diffX);

            // 1. ПЕРЕЛИСТЫВАНИЕ ТОЛЬКО ПО СВАЙПУ (сдвиг более 50px)
            if (isSwiping && totalDiff > 50) {
                if (diffX < 0) {
                    viewerEl.style.transform = "translateX(-100vw)";
                    setTimeout(() => {
                        rendition.next();
                        viewerEl.style.transform = "translateX(0)";
                    }, 180);
                } else {
                    viewerEl.style.transform = "translateX(100vw)";
                    setTimeout(() => {
                        rendition.prev();
                        viewerEl.style.transform = "translateX(0)";
                    }, 180);
                }
                return;
            }

            // Возврат на место, если свайп был слишком короткий
            viewerEl.style.transform = "translateX(0)";

            // 2. ДВОЙНОЙ ТАП ДЛЯ ВЫЗОВА МЕНЮ (одиночные тапы игнорируются)
            if (!isSwiping && totalDiff < 10) {
                const now = Date.now();
                if (now - lastTapTime < 340) {
                    togglePanels();
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;
            }
        }, { passive: true });

        // --- УПРАВЛЕНИЕ МЕНЮ ---
        function togglePanels() {
            uiVisible = !uiVisible;
            document.getElementById("header").classList.toggle("visible", uiVisible);
            document.getElementById("footer").classList.toggle("visible", uiVisible);
            if (!uiVisible) {
                document.getElementById("settings-sheet").classList.remove("visible");
                document.getElementById("overlay").classList.remove("visible");
            }
        }

        function closeAllPanels() {
            uiVisible = false;
            document.getElementById("header").classList.remove("visible");
            document.getElementById("footer").classList.remove("visible");
            document.getElementById("settings-sheet").classList.remove("visible");
            document.getElementById("toc-drawer").classList.remove("visible");
            document.getElementById("quotes-drawer").classList.remove("visible");
            document.getElementById("overlay").classList.remove("visible");
        }

        function openSettingsSheet() {
            document.getElementById("footer").classList.remove("visible");
            document.getElementById("settings-sheet").classList.add("visible");
        }

        function backToMainMenu() {
            document.getElementById("settings-sheet").classList.remove("visible");
            document.getElementById("footer").classList.add("visible");
        }

        function openDrawer(type) {
            closeAllPanels();
            if (type === 'toc') {
                document.getElementById("toc-drawer").classList.add("visible");
            } else if (type === 'quotes') {
                renderQuotesList();
                document.getElementById("quotes-drawer").classList.add("visible");
            }
            document.getElementById("overlay").classList.add("visible");
        }

        function applyTheme(name, save = true) {
            const t = themes[name];
            rendition.themes.select(name);
            document.documentElement.style.setProperty("--bg-color", t.bg);
            document.documentElement.style.setProperty("--text-color", t.text);
            document.documentElement.style.setProperty("--ui-bg", t.ui);
            if (save) localStorage.setItem("book_theme", name);
        }

        function changeFontFamily(type) {
            currentFontFamily = type;
            localStorage.setItem("book_font_family", type);

            document.querySelectorAll(".font-chip").forEach(c => c.classList.remove("active"));
            const btn = document.getElementById(`font-${type}`);
            if (btn) btn.classList.add("active");

            registerThemes();
            applyTheme(localStorage.getItem("book_theme") || "black", false);
        }

        function changeFontSize(delta) {
            currentFontSize = Math.min(28, Math.max(14, currentFontSize + delta));
            rendition.themes.fontSize(`${currentFontSize}px`);
            localStorage.setItem("book_font_size", currentFontSize);
        }

        function setBookmark() {
            const loc = rendition.currentLocation();
            if (loc && loc.start) {
                localStorage.setItem("book_last_location", loc.start.cfi);
                if (tg) tg.HapticFeedback?.notificationOccurred("success");
                alert("🔖 Закладка сохранена!");
            }
        }

        function renderQuotesList() {
            const list = document.getElementById("quotes-list");
            list.innerHTML = "";
            const quotes = JSON.parse(localStorage.getItem("book_quotes") || "[]");

            if (quotes.length === 0) {
                list.innerHTML = `<li style="padding: 20px; opacity: 0.5; text-align: center;">У вас пока нет сохраненных цитат</li>`;
                return;
            }

            quotes.forEach((q) => {
                const li = document.createElement("li");
                li.className = "quote-item";
                li.innerHTML = `
                    <div style="font-size: 13px; line-height: 1.4;">«${q.text}»</div>
                    <div style="font-size: 11px; opacity: 0.5;">${q.date}</div>
                `;
                li.onclick = () => {
                    rendition.display(q.cfi);
                    closeAllPanels();
                };
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
