<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Читалка</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- JSZip и epub.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f10;
            --text-color: #ececec;
            --ui-bg: rgba(26, 26, 28, 0.95);
            --ui-border: rgba(255, 255, 255, 0.1);
            --accent: #ff4b4b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #viewer {
            width: 100vw;
            height: 100vh;
        }

        /* --- ХЕДЕР И ФУТЕР --- */
        .ui-panel {
            position: fixed;
            left: 0;
            width: 100%;
            background: var(--ui-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            transition: transform 0.25s ease, opacity 0.25s ease;
            box-sizing: border-box;
        }

        .header {
            top: 0;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--ui-border);
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .header.visible, .footer.visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 10px;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-author {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .footer {
            bottom: 0;
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid var(--ui-border);
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            opacity: 0.75;
        }

        .progress-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .footer-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: inherit;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- ПАНЕЛЬ НАСТРОЙКИ ШРИФТА И ТЕМЫ --- */
        .settings-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--ui-bg);
            border-top: 1px solid var(--ui-border);
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 110;
            transform: translateY(100%);
            transition: transform 0.25s ease;
        }

        .settings-sheet.visible {
            transform: translateY(0);
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .theme-btn {
            border: 1px solid var(--ui-border);
            border-radius: 12px;
            padding: 10px 0;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        .theme-white { background: #f7f7f7; color: #111; }
        .theme-sepia { background: #f4ecd8; color: #5b4636; }
        .theme-gray  { background: #333336; color: #eee; }
        .theme-black { background: #000000; color: #aaa; border-color: #444; }

        .font-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 12px;
        }

        .font-stepper {
            display: flex;
            gap: 12px;
        }

        .stepper-btn {
            background: rgba(255, 255, 255, 0.1);
            color: inherit;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- БОКОВАЯ ШТОРКА ОГЛАВЛЕНИЯ --- */
        .toc-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 80%;
            max-width: 340px;
            height: 100%;
            background: var(--ui-bg);
            border-right: 1px solid var(--ui-border);
            z-index: 120;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .toc-drawer.visible {
            transform: translateX(0);
        }

        .toc-header {
            padding: 18px;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 1px solid var(--ui-border);
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            list-style: none;
            margin: 0;
        }

        .toc-item {
            padding: 12px 18px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        /* --- МОДАЛЬНОЕ ОКНО ДЛЯ СНОСОК --- */
        .footnote-popup {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            max-height: 45vh;
            background: var(--ui-bg);
            border: 1px solid var(--ui-border);
            border-radius: 16px;
            padding: 16px;
            z-index: 200;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .footnote-popup.visible {
            display: flex;
        }

        .footnote-content {
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            max-height: 30vh;
            margin-bottom: 12px;
        }

        .footnote-close {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.1);
            color: inherit;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 90;
            display: none;
        }

        .overlay.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="overlay" class="overlay" onclick="closeAllPanels()"></div>

    <!-- Верхний Хедер -->
    <div id="header" class="ui-panel header">
        <button class="btn-icon" onclick="openToc()">☰</button>
        <div class="header-title-box">
            <span id="book-title" class="header-title">Загрузка...</span>
            <span id="book-author" class="header-author">...</span>
        </div>
        <div style="width: 28px;"></div>
    </div>

    <!-- Нижний Футер -->
    <div id="footer" class="ui-panel footer">
        <div class="progress-row">
            <span id="chapter-title">Глава</span>
            <span id="reading-percent">0%</span>
        </div>
        <input type="range" id="progress-slider" class="progress-slider" min="0" max="100" value="0">
        <div class="footer-tools">
            <button class="btn-icon" onclick="openToc()">📖</button>
            <button class="btn-icon" style="color: var(--accent);" onclick="setBookmark()">🔖</button>
            <button class="btn-icon" onclick="toggleSettings()">Aa</button>
        </div>
    </div>

    <!-- Настройки текста и темы -->
    <div id="settings-sheet" class="settings-sheet">
        <div class="theme-buttons">
            <button class="theme-btn theme-white" onclick="applyTheme('white')">Белый</button>
            <button class="theme-btn theme-sepia" onclick="applyTheme('sepia')">Сепия</button>
            <button class="theme-btn theme-gray" onclick="applyTheme('gray')">Серый</button>
            <button class="theme-btn theme-black" onclick="applyTheme('black')">Черный</button>
        </div>
        <div class="font-row">
            <span>Размер текста</span>
            <div class="font-stepper">
                <button class="stepper-btn" onclick="changeFontSize(-1)">−</button>
                <button class="stepper-btn" onclick="changeFontSize(1)">+</button>
            </div>
        </div>
    </div>

    <!-- Оглавление -->
    <div id="toc-drawer" class="toc-drawer">
        <div class="toc-header">Содержание</div>
        <ul id="toc-list" class="toc-list"></ul>
    </div>

    <!-- Всплывающая сноска -->
    <div id="footnote-popup" class="footnote-popup">
        <div id="footnote-content" class="footnote-content"></div>
        <button class="footnote-close" onclick="closeFootnote()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const BOOK_URL = "infinity_jest.epub";
        const book = ePub(BOOK_URL);
        const rendition = book.renderTo("viewer", {
            width: "100%",
            height: "100%",
            spread: "none"
        });

        let currentFontSize = parseInt(localStorage.getItem("book_font_size")) || 18;
        let uiVisible = false;
        let lastReadLocation = localStorage.getItem("book_last_location");

        // 1. Темы оформления
        const themes = {
            white: { bg: "#ffffff", text: "#111111", ui: "rgba(245, 245, 247, 0.95)" },
            sepia: { bg: "#f4ecd8", text: "#5b4636", ui: "rgba(238, 228, 206, 0.95)" },
            gray:  { bg: "#2c2c2e", text: "#e5e5e7", ui: "rgba(44, 44, 46, 0.95)" },
            black: { bg: "#000000", text: "#a1a1a6", ui: "rgba(20, 20, 22, 0.95)" }
        };

        function registerThemes() {
            for (let [name, t] of Object.entries(themes)) {
                rendition.themes.register(name, {
                    "body": {
                        "background-color": `${t.bg} !important`,
                        "color": `${t.text} !important`,
                        "padding": "0 18px !important",
                        "font-family": "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important",
                        "line-height": "1.6 !important"
                    },
                    "p, span, div, h1, h2, h3, h4, h5, h6": {
                        "color": `${t.text} !important`
                    }
                });
            }
        }

        registerThemes();
        let savedTheme = localStorage.getItem("book_theme") || "black";
        applyTheme(savedTheme, false);

        // 2. Отображение и восстановление закладки
        rendition.display(lastReadLocation || undefined);

        // Метаданные книги и оглавление
        book.loaded.metadata.then(meta => {
            document.getElementById("book-title").innerText = meta.title || "Книга";
            document.getElementById("book-author").innerText = meta.creator || "";
        });

        book.loaded.navigation.then(nav => {
            const list = document.getElementById("toc-list");
            list.innerHTML = "";
            nav.toc.forEach(chapter => {
                const li = document.createElement("li");
                li.className = "toc-item";
                li.innerText = chapter.label.trim();
                li.onclick = () => {
                    rendition.display(chapter.href);
                    closeAllPanels();
                };
                list.appendChild(li);
            });
        });

        // Генерация расположений для прогресс-бара
        book.ready.then(() => {
            return book.locations.generate(1000);
        }).then(() => {
            updateProgress();
        });

        // 3. Автоматическое сохранение позиции чтения
        rendition.on("relocated", location => {
            const cfi = location.start.cfi;
            localStorage.setItem("book_last_location", cfi);
            updateProgress(location);
        });

        function updateProgress(location) {
            if (!book.locations.length()) return;
            const currentLocation = location || rendition.currentLocation();
            if (currentLocation && currentLocation.start) {
                const percent = Math.floor(book.locations.percentageFromCfi(currentLocation.start.cfi) * 100);
                document.getElementById("reading-percent").innerText = `${percent}%`;
                document.getElementById("progress-slider").value = percent;
            }
        }

        document.getElementById("progress-slider").addEventListener("change", (e) => {
            const cfi = book.locations.cfiFromPercentage(e.target.value / 100);
            rendition.display(cfi);
        });

        // 4. Обработка кликов, свайпов и всплывающих сносок
        rendition.on("rendered", (section, view) => {
            const frameDoc = view.document;
            if (!frameDoc) return;

            // Обработка сносок (всплывающее окно вместо улетания в конец)
            const links = frameDoc.querySelectorAll("a");
            links.forEach(link => {
                const href = link.getAttribute("href");
                if (href && (href.startsWith("#") || href.includes("note") || href.includes("footnote"))) {
                    link.addEventListener("click", (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        showFootnote(href, link.innerText);
                    });
                }
            });

            // Нажатия и свайпы
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;

            frameDoc.addEventListener("touchstart", (e) => {
                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
                touchStartTime = Date.now();
            }, { passive: true });

            frameDoc.addEventListener("touchend", (e) => {
                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;
                const timeDiff = Date.now() - touchStartTime;

                // Свайп влево/вправо
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                    if (diffX < 0) rendition.next();
                    else rendition.prev();
                    return;
                }

                // Тап без движения
                if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10 && timeDiff < 300) {
                    const width = window.innerWidth;
                    const x = e.changedTouches[0].clientX;

                    if (x < width * 0.3) {
                        rendition.prev();
                    } else if (x > width * 0.7) {
                        rendition.next();
                    } else {
                        // Тап в центр -> показать/скрыть хедер и футер
                        togglePanels();
                    }
                }
            }, { passive: true });
        });

        // --- УПРАВЛЕНИЕ ИНТЕРФЕЙСОМ ---
        function togglePanels() {
            uiVisible = !uiVisible;
            document.getElementById("header").classList.toggle("visible", uiVisible);
            document.getElementById("footer").classList.toggle("visible", uiVisible);
            if (!uiVisible) {
                document.getElementById("settings-sheet").classList.remove("visible");
                document.getElementById("overlay").classList.remove("visible");
            }
        }

        function closeAllPanels() {
            uiVisible = false;
            document.getElementById("header").classList.remove("visible");
            document.getElementById("footer").classList.remove("visible");
            document.getElementById("settings-sheet").classList.remove("visible");
            document.getElementById("toc-drawer").classList.remove("visible");
            document.getElementById("overlay").classList.remove("visible");
        }

        function toggleSettings() {
            const sheet = document.getElementById("settings-sheet");
            sheet.classList.toggle("visible");
        }

        function openToc() {
            closeAllPanels();
            document.getElementById("toc-drawer").classList.add("visible");
            document.getElementById("overlay").classList.add("visible");
        }

        function applyTheme(name, save = true) {
            const t = themes[name];
            rendition.themes.select(name);
            document.documentElement.style.setProperty("--bg-color", t.bg);
            document.documentElement.style.setProperty("--text-color", t.text);
            document.documentElement.style.setProperty("--ui-bg", t.ui);
            if (save) localStorage.setItem("book_theme", name);
        }

        function changeFontSize(delta) {
            currentFontSize = Math.min(28, Math.max(14, currentFontSize + delta));
            rendition.themes.fontSize(`${currentFontSize}px`);
            localStorage.setItem("book_font_size", currentFontSize);
        }

        function setBookmark() {
            const loc = rendition.currentLocation();
            if (loc && loc.start) {
                localStorage.setItem("book_last_location", loc.start.cfi);
                if (tg) tg.HapticFeedback?.notificationOccurred("success");
                alert("🔖 Закладка сохранена!");
            }
        }

        // --- СНОСКИ ---
        function showFootnote(href, title) {
            const id = href.split("#")[1];
            book.spine.get(href).then(section => {
                return section.load(book.load.bind(book));
            }).then(doc => {
                const target = id ? doc.getElementById(id) : null;
                const text = target ? target.innerText : "Сноска: " + title;
                document.getElementById("footnote-content").innerText = text;
                document.getElementById("footnote-popup").classList.add("visible");
            }).catch(() => {
                document.getElementById("footnote-content").innerText = "Сноска: " + title;
                document.getElementById("footnote-popup").classList.add("visible");
            });
        }

        function closeFootnote() {
            document.getElementById("footnote-popup").classList.remove("visible");
        }
    </script>
</body>
</html>
